name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The benches, before anything ships. Until this job existed every push
  # deployed straight to production with nothing run at all: 2,124 assertions,
  # 173 in the ENA suite and 37 mutations that only ever executed because
  # somebody remembered to type them.
  #
  # Thirteen seconds, and no dependencies to install — these are plain node ESM
  # files with no package.json, importing nothing but node builtins and the
  # sources they test. node-suite.mjs stands up its own hostile HTTP server on
  # localhost; nothing here reaches the network.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A table in, an SVG string out: every figure, every export format, the
      # trimmer's parity with sylph's own reader, and the shipped example
      # checked against the study it claims to come from.
      - name: Parity suite
        run: node web/fastq-trim.parity.test.mjs

      # KEGG orthologs into modules and pathways, and the pathway figure. Hand
      # -built profiles whose answers are worked out on paper, then the shipped
      # ko-map.json — so a rebuild that changes its shape fails here.
      - name: KEGG roll-ups
        run: node web/kegg.test.mjs

      # The protein sketcher, against the four shapes the worker feeds it in:
      # whole buffers, chunks that fall inside a line, and two mates arriving
      # interleaved. A reader that loses the FASTQ record phase does not throw —
      # it returns a smaller profile — so the checks demand the SAME profile out
      # of every shape.
      - name: Protein sketcher
        run: node web/func-sketch.test.mjs

      # Searching and sorting a matrix of hundreds of rows: what a search matches,
      # what happens to ties, and the third click that gives the original order
      # back.
      - name: Table view
        run: node web/table-view.test.mjs

      # The contrast figure's test, against values worked out on paper and
      # against an independent brute-force enumeration of the same permutation
      # null. A p-value that is wrong by a factor of two looks exactly like one
      # that is right, which is why this is the one thing here that cannot be
      # checked by looking at the page.
      - name: Statistics
        run: node web/stats.test.mjs

      # Where a sample grouping comes from — a metadata field, the editor, or a
      # CSV — and which fields are worth offering at all. A field with one value
      # for every sample, or a distinct value per sample, groups nothing.
      - name: Sample groups
        run: node web/groups.test.mjs

      # The Gut Metabolic Module parser and estimator, on definitions small
      # enough to work out on paper. The real catalogue is NOT in this repository
      # — VIB licenses it for academic use inside one institution — so the checks
      # that need it are skipped here and run locally with GMM_DEFS set.
      - name: Gut Metabolic Modules
        run: node web/gmm.test.mjs

      # What the pages CLAIM against what they ship — a sentence in a banner, a
      # control that must be frozen during a run, a door that must not be
      # inside the card it opens.
      - name: Wiring
        run: node scripts/ena-test/wiring.mjs

      # web/ena.js against a server that lies: truncated bodies, spliced
      # responses, holes, hosts outside the allow-list.
      - name: ENA suite
        run: node scripts/ena-test/node-suite.mjs

  # "A test that fails if you remove the mechanism" — checked, not claimed. Four
  # minutes, and deliberately NOT a gate on the deploy: it does not test the
  # page, it tests whether the benches above still bite. A red run here means a
  # guard has stopped guarding, which is worth knowing on every push and is not
  # worth holding the site back for.
  #
  # It earns its place: it is what caught two guards that had never worked,
  # hidden behind assertions that had been failing so long the number was noise.
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mutation suite
        run: node scripts/ena-test/mutations.mjs

  deploy:
    # Nothing reaches production that the benches have not read first.
    needs: test
    # A pull request runs the benches and stops there: Pages has one live
    # deployment and a branch must not take it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # web/sylph-pkg/ ships the wasm-pack output (sylph_wasm.js +
      # sylph_wasm_bg.wasm). The nineteen reference databases are NOT in the
      # repo — 6.24 GiB, far past what Pages will serve. They live in Zenodo
      # record 21842023 (DOI 10.5281/zenodo.21842023, CC0) and the web app
      # fetches the one the user picked at runtime, from the URLs in
      # web/db/biomes.json. Zenodo rather than a GitHub Release because Release
      # assets return no CORS headers, so the browser cannot fetch() them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
